<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home - Classroom</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/HamCraft-UB/Singlefile@main/assets/games.css">
<style>
  :root {
    color-scheme: dark;
    --purple: #24103f;
    --deep: #130a20;
    --gold: #fdb927;
    --light-gold: #ffe08a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    color: #fff;
    font-family: Arial, sans-serif;
    background:
      radial-gradient(ellipse at 50% -10%, #673ca0 0, transparent 55%),
      linear-gradient(145deg, var(--deep), var(--purple));
    min-height: 100vh;
  }
  .top {
    padding: 34px 16px 26px;
    text-align: center;
    background: linear-gradient(135deg, #32165a, #180d29);
    border-bottom: 3px solid var(--gold);
    box-shadow: 0 8px 30px #0007;
  }
  .top h1 {
    margin: 0;
    color: var(--gold);
    font-size: clamp(2rem, 7vw, 4rem);
    font-weight: 900;
    letter-spacing: .04em;
    text-shadow: 0 3px 0 #8f5e00, 0 0 24px #fdb92755;
  }
  .top p {
    margin: 8px 0 0;
    color: var(--light-gold);
    font-size: 1.1rem;
    font-weight: bold;
    letter-spacing: .2em;
    text-transform: uppercase;
  }
  body > div:not(.top) { text-align: center; }
  .bloxy-btn {
    display: inline-block;
    margin: 20px 0 8px;
    padding: 12px 22px;
    border: 2px solid var(--gold);
    border-radius: 999px;
    background: var(--gold);
    color: #24103f !important;
    font-weight: 900;
    text-decoration: none;
    box-shadow: 0 5px 18px #fdb92744;
  }
  #controls { padding: 12px 16px; }
  #searchBox {
    width: min(560px, 100%);
    padding: 14px 18px;
    border: 2px solid #7755a1;
    border-radius: 12px;
    outline: none;
    background: #1d1030;
    color: white;
    font-size: 1rem;
  }
  #searchBox:focus { border-color: var(--gold); }
  #gameCount, #views p { color: var(--light-gold); font-weight: bold; }
  .wrap { width: min(1200px, 94%); margin: 0 auto 40px; }
  .grid { gap: 18px; }
  .grid > * {
    border: 1px solid #704d96 !important;
    border-radius: 14px !important;
    background: #24163a !important;
    box-shadow: 0 8px 22px #0005;
    overflow: hidden;
  }
  .grid > *:hover {
    border-color: var(--gold) !important;
    transform: translateY(-3px);
  }
  #viewerOverlay { background: #090510dd !important; }
  #viewerWindow {
    border: 2px solid var(--gold) !important;
    border-radius: 14px !important;
    overflow: hidden;
    background: var(--deep) !important;
  }
  #viewerHeader {
    background: #32165a !important;
    color: var(--gold) !important;
  }
  #viewerHeader button {
    padding: 8px 13px;
    border: 0;
    border-radius: 8px;
    background: var(--gold);
    color: #24103f;
    font-weight: bold;
    cursor: pointer;
  }
  #viewerFrame { background: white; }
</style>
</head>
<body>
  <div class="top">
    <h1>LEBRON IS THE G.O.A.T</h1>
    <p>🏀 ALL HAIL KING SUNSHINE BRON 🏀</p>
  </div>

  <div>
    <a target="_blank" class="bloxy-rainbow-btn bloxy-btn"
       href="https://bloxcraft-ubg.pages.dev?utm_source=hamcraft-ub.github.io">
      MORE GAMES
    </a>
  </div>

  <div id="controls">
    <input id="searchBox" placeholder="Search games..." aria-label="Search games">
  </div>

  <div><p id="gameCount">Games: 0</p></div>
  <div id="views"><p>Scroll down to see all games</p></div>

  <div class="wrap">
    <div id="gameGrid" class="grid"></div>
    <div id="status" style="display:none; padding:24px;">Loading...</div>
  </div>

  <div id="viewerOverlay">
    <div id="viewerWindow">
      <div id="viewerHeader">
        <span id="viewerTitle">Loading...</span>
        <div>
          <button id="newTabBtn">New Tab</button>
          <button id="closeBtn">Close</button>
        </div>
      </div>
      <iframe id="viewerFrame" sandbox="allow-scripts allow-same-origin allow-forms"></iframe>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/gh/HamCraft-UB/Singlefile@main/assets/games.js"></script>
</body>
</html>

  </template>

 <script>
  window.addEventListener("load", () => {
    const gameWindow = window.open("about:blank", "_blank");
    if (!gameWindow) {
      alert("The browser blocked the new tab. Allow pop-ups and reload.");
      return;
    }

    gameWindow.document.open();
    gameWindow.document.write(
      '<!doctype html><link rel="icon" href="https://www.gstatic.com/classroom/favicon.png">'
    );
    gameWindow.document.write(
      document.getElementById("game-source").innerHTML
    );
    gameWindow.document.close();
  });
</script>
</body>
</html>
